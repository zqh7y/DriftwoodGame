# Builds the Android app (debug APK) on every push and pull request.
# Download it from the run's "Artifacts" section (DriftwoodDock-debug-apk).
# Pushing a tag like v0.1.0 also attaches the APK to a GitHub Release.
name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web game
        run: npm run build

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Optional: with a saved debug key (repo secret ANDROID_DEBUG_KEYSTORE_BASE64, see docs/ANDROID.md)
      # every APK is signed the same way, so a new build installs over the old one and keeps your save.
      - name: Use the saved debug key (if set)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Using the saved debug key."
          else
            echo "No saved debug key; Gradle will make a fresh one for this build."
          fi

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: DriftwoodDock-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: DriftwoodDock-debug-apk
          path: apk

      - name: Name the APK after the tag
        run: mv apk/app-debug.apk "apk/DriftwoodDock-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/DriftwoodDock-*.apk
          generate_release_notes: true
