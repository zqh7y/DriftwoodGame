    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d8fd6"/><stop offset="0.55" stop-color="#f4a7b5"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
